# ============================================
# ChromaDB Knowledge Server - Docker Compose
# ============================================

version: '3.8'

services:
  chromadb-server:
    build: .
    container_name: chromadb-knowledge-server
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FLASK_ENV=${FLASK_ENV:-production}
      - CHROMADB_PATH=/app/data/chromadb
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - CHROMADB_API_KEY=${CHROMADB_API_KEY:-}
    volumes:
      - chromadb_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health-check', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chromadb_data:
    driver: local
